---
# GitLab CI/CD Pipeline for auth
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.54.0

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.54.0

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.54.0

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.54.0
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.54.0

variables:
  ZIG_VERSION: "0.16.0"

cache:
  key: zig-$ZIG_VERSION
  paths:
    - zig-$ZIG_VERSION/
    - .zig-cache/

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  # digest of bookworm-slim as of 2026-06-12 — bump deliberately
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# FIPS provider provisioning: builds latest OpenSSL + FIPS provider.
# Required before any -Dfips=true build/test (spec §8). The canonical
# source of scripts/install-openssl-fips.sh is the `fips` package; it is
# vendored here (and is also distributed via the ci-catalog FIPS
# component).
fips-deps:
  stage: build
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - apt-get update && apt-get install -y build-essential perl wget ca-certificates sudo
  script:
    - OPENSSL_PREFIX=/usr/local/ssl ./scripts/install-openssl-fips.sh
  artifacts:
    paths:
      - /usr/local/ssl
    expire_in: 1 day

# FIPS-mode tests: std shim suite already covered by `test`; this job
# runs the OpenSSL FIPS backend suite (-Dfips=true).
test-fips:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test -Dfips=true -Dopenssl_path=/usr/local/ssl --summary all
    - zig build test-integration -Dfips=true -Dopenssl_path=/usr/local/ssl --summary all
  needs:
    - build
    - fips-deps
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim@sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build
